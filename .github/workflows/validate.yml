name: Validate Zensical

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  validate:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.14"

      - run: uv sync --locked

      - run: uv run --locked zensical build --clean

      - run: uv run --locked python scripts/check_zensical_site.py
