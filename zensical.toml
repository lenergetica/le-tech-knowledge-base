[project]
site_name = "Tech Knowledge Base"
site_description = "Base de coneixement de l'equip Tech"
site_author = "Equip de Tecnologia de L'Energètica"
repo_url = "https://github.com/lenergetica/le-tech-knowledge-base"
repo_name = "lenergetica/le-tech-knowledge-base"
docs_dir = "docs"
site_dir = "site"
extra_javascript = ["assets/javascripts/status-warning.js"]

nav = [
    { "Guia de la KB" = "index.md" },
    { "01 - Operacions" = [
        { "Certificats" = [
            { "Renovar certificat SSL Edison" = "01/certificats/renovar-certificat-ssl-edison.md" },
        ] },
        { "Postgres" = [
            { "Configurar postgres_fdw" = "01/postgres/configurar-postgres_fdw.md" },
            { "Configuració FDW inicial i còpia pilot" = "01/postgres/migrar-taules-develrw-de-pro-a-hall.md" },
            { "Migrar scripts ETL de Pro a Hall" = "01/postgres/migrar-scripts-etl-de-pro-a-hall.md" },
            { "Operació Barman Hall" = "01/postgres/operacio-barman-hall.md" },
            { "Migració de BD PostgreSQL/TimescaleDB a un volum dedicat" = "01/postgres/migrar-bd-Hall-a-volum-dedicat.md" },
            { "Restaurar BD develrw a Hall" = "01/postgres/restaurar-develrw-a-Hall.md" },
        ] },
    ] },
    { "02 - Processos de negoci" = [
        { "GISCE" = [
            { "API REST GISCE" = "02/gisce/api-rest-gisce.md" },
        ] },
    ] },
    { "03 - Dades i analítica" = [
        { "Projecte" = "index.md" },
    ] },
    { "04 - Servidors i Infraestructura" = [
        { "edison" = [
            { "GISCE gateway" = "04/edison/gateway-gisce.md" },
        ] },
    ] },
    { "05 - Seguretat" = [
        { "0501" = "index.md" },
    ] },
    { "06 - Projectes" = [
        { "0601" = "index.md" },
    ] },
    { "07 - Desenvolupament" = [
        { "0701" = "index.md" },
    ] },
    { "08 - Documentació" = [
        { "0801" = "index.md" },
    ] },
    { "09 - Formació" = [
        { "0901" = "index.md" },
    ] },
    { "10 - Telecomunicacions" = [
        { "Plantes" = [
            { "Cardedeu" = "telecom/cardedeu.md" },
        ] },
        { "Components" = [
            { "SmartLogger" = "ot/smartlogger.md" },
        ] },
    ] },
    { "99 - Altres" = [
        { "9901" = "index.md" },
    ] },
    { "contribute" = [
        { "Contribuir a la KB" = "contribute/contribute.md" },
    ] },
]

[project.theme]
variant = "modern"
language = "ca"
custom_dir = "overrides"
features = [
    "navigation.path",
    "navigation.top",
    "navigation.footer",
    "content.code.copy",
    "content.code.annotate",
    "content.tabs.link",
    "search.highlight",
    "toc.follow",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Canvia al tema fosc"

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Canvia al tema clar"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.snippets = {}
pymdownx.superfences.custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
